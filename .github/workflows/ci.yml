name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit repository secrets
        run: npm run audit:secrets
      - name: Run tests
        run: npm test
      - name: Test Even G2 companion
        run: npm run test:even
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundles
        run: npm run build
      - name: Smoke-test the real Chromium browser core
        timeout-minutes: 2
        run: xvfb-run -a npm run smoke:browser
      - name: Smoke-test the local MCP helper and one-time capability
        timeout-minutes: 2
        run: xvfb-run -a npm run smoke:browser:provider-helper

  windows-pipe-host:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and build native modules
        run: npm ci
      - name: Build and self-test current-user-only named-pipe host
        run: npm run test:windows-pipe-host
      - name: Type-check Windows gateway integration
        run: npm run typecheck
      - name: Verify the packaged host resource
        run: npm run package:win

  macos-cli-resolution:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the packaged macOS application
        # Public test key keeps fork PR packaging independent of release-owner configuration.
        # Only release.yml uses the owner's key to produce publishable artifacts.
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || 'iojj3XQJ8ZX9UtstPLpdcspnCb8dlBIb83SIAbQPb1w=' }}
        run: npm run package:mac
      - name: Smoke-test packaged macOS CLI resolution
        run: npm run smoke:cli-resolution:mac
