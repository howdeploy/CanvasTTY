name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            script: package:linux
            artifact: canvastty-linux
          - name: Windows
            runner: windows-latest
            script: package:win
            artifact: canvastty-windows
          - name: macOS
            runner: macos-latest
            script: package:mac
            artifact: canvastty-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit repository secrets
        run: npm run audit:secrets
      - name: Run tests
        run: npm test
      - name: Build installers
        run: npm run ${{ matrix.script }}
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          app="$(find release -type d -name 'CanvasTTY.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
      - name: Smoke-test packaged macOS CLI resolution
        if: runner.os == 'macOS'
        run: npm run smoke:cli-resolution:mac
      - name: Install AppImage runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfuse2t64
      - name: Smoke-test packaged AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a npm run smoke:appimage
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "${GITHUB_REF_NAME}"
            release-artifacts/*
            --repo "${GITHUB_REPOSITORY}"
            --title "CanvasTTY ${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
