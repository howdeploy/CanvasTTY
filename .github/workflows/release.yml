name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    env:
      CANVASTTY_GITHUB_CLIENT_ID: ${{ vars.CANVASTTY_GITHUB_CLIENT_ID }}
      CANVASTTY_REQUIRE_NATIVE_HELPERS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            script: package:linux
            artifact: canvastty-linux
          - name: Windows
            runner: windows-latest
            script: package:win
            artifact: canvastty-windows
          - name: macOS
            runner: macos-latest
            script: package:mac
            artifact: canvastty-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Note plugin showcase sign-in availability
        if: ${{ vars.CANVASTTY_GITHUB_CLIENT_ID == '' }}
        run: echo "::warning::CANVASTTY_GITHUB_CLIENT_ID is not set. The plugin showcase still works anonymously; GitHub sign-in is unavailable in this build."
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Go (canvastty-helper, standard library only)
        uses: actions/setup-go@v5
        with:
          go-version-file: native/canvastty-helper/go.mod
          cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit repository secrets
        run: npm run audit:secrets
      - name: Build the native helper (the parity tests run it)
        run: npm run build:helpers -- --host
      - name: Verify the tracked native catalog was already current
        run: git diff --exit-code -- native/canvastty-helper/catalog.json
      - name: Report Linux isolation capability without changing host security
        if: runner.os == 'Linux'
        id: linux-isolation
        timeout-minutes: 1
        run: |
          if [ -x /usr/bin/bwrap ] && /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc true; then
            echo "required=1" >> "$GITHUB_OUTPUT"
            echo "Bubblewrap capability is available; the root suite must exercise real enforcement."
          else
            echo "required=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Linux isolation unsupported::This runner cannot exercise real bubblewrap enforcement. The root suite will report the capability as unsupported, not as an enforcement pass."
          fi
      - name: Run tests
        env:
          CANVASTTY_REQUIRE_BWRAP: ${{ steps.linux-isolation.outputs.required }}
        run: npm test
      - name: Build installers
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }}
      - name: Build macOS installers with owner public key
        if: runner.os == 'macOS'
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: npm run package:mac
      - name: Generate signed Sparkle appcast
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY"
          node scripts/verify-sparkle-key.mjs
          mkdir -p release/appcast-input
          cp release/*-mac-arm64.zip release/appcast-input/
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | artifacts/sparkle/distribution/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/howdeploy/CanvasTTY/releases/download/${GITHUB_REF_NAME}/" \
            release/appcast-input
          cp release/appcast-input/appcast.xml release/appcast.xml
      - name: Audit built bundle secrets
        run: npm run audit:secrets
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          app="$(find release -type d -name 'CanvasTTY.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
      - name: Smoke-test packaged macOS CLI resolution
        if: runner.os == 'macOS'
        run: npm run smoke:cli-resolution:mac
      - name: Install AppImage runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfuse2t64
      - name: Smoke-test packaged AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a npm run smoke:appimage
      # electron-updater reads the channel manifests (latest.yml, latest-mac.yml,
      # latest-linux.yml) next to the installers, and the NSIS differential
      # download needs the .blockmap files. Without them the packaged
      # checkForUpdates() path has nothing to check against.
      - name: Upload installers and update manifests
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
            release/appcast.xml
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Include the pinned CanvasLink installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          canvaslink_version="$(node -p "require('./integrations/canvaslink/package.json').version")"
          gh release download "canvaslink-v${canvaslink_version}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.apk' --pattern 'canvaslink-release.json' --dir release-artifacts
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { CANVASLINK_ANDROID_RELEASE as release } from './src/shared/canvasLinkInstall.ts';
          const apk = readFileSync(`release-artifacts/CanvasLink-${release.version}.apk`);
          if (createHash('sha256').update(apk).digest('hex') !== release.sha256) {
            throw new Error('CanvasLink APK does not match the pinned installation checksum');
          }
          JS
      - name: Verify release tag and artifact set
        run: node scripts/verify-release-artifacts.mjs "${GITHUB_REF_NAME}" release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "${GITHUB_REF_NAME}"
            release-artifacts/*
            --repo "${GITHUB_REPOSITORY}"
            --title "CanvasTTY ${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
