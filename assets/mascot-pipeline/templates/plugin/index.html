<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; justify-content: center; align-items: flex-end; }
    .sprite { height: 100%; touch-action: none; cursor: grab; }
    .sprite:active { cursor: grabbing; }
    .picker { position: fixed; top: 8px; right: 46px; z-index: 5; }
    .picker-toggle { width: 34px; height: 34px; border: 1px solid #68616f; border-radius: 9px;
      color: #f5f2f7; background: #27242ee8; font: 22px/1 system-ui, sans-serif; cursor: pointer;
      opacity: 0; transition: opacity .16s ease, background .16s ease; }
    body:hover .picker-toggle, .picker:focus-within .picker-toggle, .picker.open .picker-toggle { opacity: 1; }
    .picker-toggle:hover { background: #393340; }
    .picker-menu { position: absolute; top: 42px; right: -46px; box-sizing: border-box;
      width: min(220px, 100vw); max-height: min(360px, calc(100vh - 58px)); overflow: auto;
      padding: 5px; border: 1px solid #635d6b; border-radius: 12px; background: #24212af5;
      box-shadow: 0 12px 32px #0008; opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(-6px); transition: opacity .18s ease, transform .18s ease, visibility .18s; }
    .picker.open .picker-menu { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .picker-option { display: block; width: 100%; padding: 9px 11px; border: 0; border-radius: 8px;
      color: #f5f2f7; background: transparent; font: 600 13px system-ui, sans-serif;
      text-align: left; cursor: pointer; }
    .picker-option:hover, .picker-option[aria-checked="true"] { background: #51415d; }
    .picker-toggle:focus-visible, .picker-option:focus-visible { outline: 2px solid #db9dff; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .picker-toggle, .picker-menu { transition: none; } }
  </style>
</head>
<body>
  <div class="sprite" role="img" aria-label="Animated mascot"></div>
  <div class="picker" id="picker">
    <button class="picker-toggle" id="picker-toggle" type="button" aria-label="Choose animation" aria-expanded="false" aria-controls="picker-menu">&#9881;</button>
    <div class="picker-menu" id="picker-menu" role="menu" aria-label="Animations"></div>
  </div>
  <script src="frames.js"></script>
  <script src="player.js"></script>
</body>
</html>
